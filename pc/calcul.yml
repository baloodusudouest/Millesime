# =============================================================================
# Millésime — calculateur sur le PC (Docker Desktop), toujours prêt
#
#   Une seule fois, dans C:\millesime :  docker compose -f calcul.yml up -d
#
#   Ensuite il tourne tout seul tant que Docker Desktop est ouvert : il demande du
#   travail à Millésime (NAS) toutes les 5 minutes et calcule dès qu'un visage attend.
#   Docker Desktop le relance à chaque ouverture. Rien n'est écrit dans Immich.
#
#   Arrêter le calculateur :  docker compose -f calcul.yml down
#   Une seule passe puis arrêt :  docker compose -f calcul.yml run --rm -e VEILLE=0 millesime-calcul
# =============================================================================

services:
  millesime-calcul:
    image: ghcr.io/baloodusudouest/millesime:calcul
    container_name: millesime_calcul
    pull_policy: always                       # dernière version à chaque (re)lancement par compose
    command: ["python", "/app/calcul.py"]
    environment:
      - MACHINE=${COMPUTERNAME:-}          # nom du PC Windows affiché dans Millésime
      - TZ=Europe/Paris
      - MILLESIME_URL=${MILLESIME_URL:-http://192.168.1.10:8098}
      - MILLESIME_JETON_CALCUL=${MILLESIME_JETON_CALCUL}
      - VEILLE=1                              # reste allumé et redemande du travail
      - VEILLE_MINUTES=${VEILLE_MINUTES:-5}
      - MIVOLO_CORPS=1
      - THREADS=${THREADS:-auto}
    volumes:
      - ./data:/data                          # cache du modèle MiVOLO (téléchargé une fois)
    restart: unless-stopped                   # relancé à chaque ouverture de Docker Desktop
